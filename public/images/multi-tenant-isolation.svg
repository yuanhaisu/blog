<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">多租户隔离</title>
  <desc id="desc">园所 A、B、C 的请求都必须经过 tenant_id 租户条件，访问共享业务表；儿童照片只对授权家长可见。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .accent { fill: #eff6ff; stroke: #2563eb; }
      .green { fill: #ecfdf5; stroke: #059669; }
      .amber { fill: #fffbeb; stroke: #d97706; }
      .title { font: 600 20px system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif; fill: #0f172a; }
      .label { font: 600 14px system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif; fill: #0f172a; }
      .small { font: 12px system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="960" height="400"/>
  <text class="title" x="480" y="38" text-anchor="middle">多租户隔离：所有查询都必须带租户条件</text>

  <rect class="accent" x="40" y="76" width="180" height="54" rx="10"/>
  <text class="label" x="130" y="108" text-anchor="middle">园所 A</text>
  <rect class="accent" x="40" y="150" width="180" height="54" rx="10"/>
  <text class="label" x="130" y="182" text-anchor="middle">园所 B</text>
  <rect class="accent" x="40" y="224" width="180" height="54" rx="10"/>
  <text class="label" x="130" y="256" text-anchor="middle">园所 C</text>

  <rect class="amber" x="300" y="130" width="220" height="94" rx="12"/>
  <text class="label" x="410" y="164" text-anchor="middle">租户条件</text>
  <text class="small" x="410" y="188" text-anchor="middle">WHERE tenant_id = ?</text>
  <text class="small" x="410" y="208" text-anchor="middle">repository 层强制注入</text>

  <path class="arrow" d="M 224 103 L 296 150"/>
  <path class="arrow" d="M 224 177 L 296 177"/>
  <path class="arrow" d="M 224 251 L 296 204"/>

  <rect class="green" x="600" y="76" width="310" height="202" rx="12"/>
  <text class="label" x="755" y="106" text-anchor="middle">共享业务表</text>
  <text class="small" x="755" y="134" text-anchor="middle">students · notices · growth</text>
  <text class="small" x="755" y="158" text-anchor="middle">pickup · tasks · messages</text>
  <text class="small" x="755" y="182" text-anchor="middle">photos · attendance · points</text>
  <text class="small" x="755" y="212" text-anchor="middle">每张表都有 tenant_id</text>
  <text class="small" x="755" y="236" text-anchor="middle">跨园所查询在 code review 中拒绝</text>
  <text class="small" x="755" y="260" text-anchor="middle">索引以租户列开头</text>

  <path class="arrow" d="M 524 177 L 596 177"/>

  <rect class="box" x="300" y="286" width="610" height="76" rx="12" stroke-dasharray="5 4"/>
  <text class="label" x="605" y="314" text-anchor="middle">敏感数据</text>
  <text class="small" x="605" y="338" text-anchor="middle">儿童照片只对授权家长可见；接送人、健康信息按角色与关系授权</text>
</svg>
