name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/blog-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Content, build, and launch checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUXT_TELEMETRY_DISABLED: '1'
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate content guardrails
        run: npm run validate:content

      - name: Scan tracked files for secrets
        run: npm run check:secrets

      - name: Build static site and Pagefind index (with test fixtures)
        run: npm run build:test

      - name: Validate JSON-LD, sitemap, RSS, robots, llms.txt, Pagefind
        run: npm run validate:artifacts

      - name: Check internal links, 404, and www redirect
        run: npm run check:links

      - name: Run Playwright suite
        run: npm run test:e2e

      - name: Deployment smoke (local Cloudflare Pages emulation)
        run: npm run smoke:deployment

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean staged test fixtures
        if: always()
        run: npm run clean:fixtures
